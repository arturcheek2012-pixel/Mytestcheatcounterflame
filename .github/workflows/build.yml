name: Build CREZ Menu

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Clone ImGui
        run: git clone --depth 1 https://github.com/ocornut/imgui imgui

      - name: Compile
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang++ \
            -arch arm64 -arch arm64e \
            -isysroot $SDK \
            -std=c++17 -fobjc-arc -O2 \
            -I. \
            -DIMGUI_DISABLE_DEMO_WINDOWS \
            -DIMGUI_DISABLE_DEBUG_TOOLS \
            -dynamiclib \
            -framework UIKit -framework Metal -framework MetalKit \
            -framework QuartzCore -framework Foundation \
            -lobjc -lc++ \
            imgui/imgui.cpp imgui/imgui_draw.cpp \
            imgui/imgui_tables.cpp imgui/imgui_widgets.cpp \
            Tweak.mm \
            -o CrezMenu.dylib

      - name: Sign
        run: xcrun -sdk iphoneos ldid -S CrezMenu.dylib || true

      - uses: actions/upload-artifact@v4
        with:
          name: crez-menu-dylib
          path: CrezMenu.dylib
          if-no-files-found: error
