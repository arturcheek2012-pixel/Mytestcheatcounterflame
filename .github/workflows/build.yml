name: Build CFEsp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Download iOS SDK
        run: |
          curl -L https://github.com/xybp888/iOS-SDKs/releases/download/iOS-SDKs/iPhoneOS17.0.sdk.tar.xz -o sdk.tar.xz
          mkdir -p ~/sdk
          tar -xJf sdk.tar.xz -C ~/sdk

      - name: Compile .dylib
        run: |
          SDK=~/sdk/iPhoneOS17.0.sdk
          clang \
            -arch arm64 \
            -isysroot $SDK \
            -fobjc-arc \
            -O2 \
            -dynamiclib \
            -framework UIKit \
            -framework CoreGraphics \
            -lobjc \
            -o CFEsp.dylib \
            Tweak.mm

      - name: Sign
        run: ldid -S CFEsp.dylib

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CFEsp-dylib
          path: CFEsp.dylib
          retention-days: 14
