name: Stage1 Engine
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-14
    steps:
      - run: |
          git clone --recursive https://github.com/nillerusr/source-engine.git
          cd source-engine
          python3 waf --help > ../waf_help.txt 2>&1 || true
          grep -rn -i "ios\|apple\|darwin\|osx" wscript scripts/waifulib/*.py > ../platform_refs.txt 2>&1 || true
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export CC="xcrun -sdk iphoneos clang -arch arm64 -miphoneos-version-min=15.0"
          export CXX="xcrun -sdk iphoneos clang++ -arch arm64 -miphoneos-version-min=15.0"
          python3 waf configure -T release --togles --disable-warns --build-games=cstrike 2>&1 | tee ../configure.log || true
          python3 waf build -j4 2>&1 | tee ../build.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-logs
          path: |
            waf_help.txt
            platform_refs.txt
            configure.log
            build.log
