name: Build CheatMenu iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build iOS arm64 dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang++ \
            -dynamiclib \
            -isysroot "$SDK" \
            -target arm64-apple-ios14.0 \
            -framework UIKit \
            -framework QuartzCore \
            -framework CoreGraphics \
            -framework Foundation \
            -fobjc-arc \
            -O2 \
            -o CheatMenu.dylib \
            src/CheatMenu.mm

      - name: Verify platform
        run: |
          lipo -info CheatMenu.dylib
          otool -l CheatMenu.dylib | grep -A3 LC_BUILD_VERSION

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CheatMenu-iOS-${{ github.sha }}
          path: CheatMenu.dylib
          retention-days: 30
