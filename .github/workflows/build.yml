name: Build dylib
  run: |
    SDK=$(xcrun --sdk iphoneos --show-sdk-path)
    xcrun -sdk iphoneos clang++ \
      -arch arm64 \
      -dynamiclib \
      -isysroot "$SDK" \
      -framework UIKit \
      -framework QuartzCore \
      -framework Foundation \
      -ObjC \
      -o CheatMenu.dylib \
      src/CheatMenu.mm

- name: Upload artifact
  uses: actions/upload-artifact@v4
  with:
    name: CheatMenu.dylib
    path: CheatMenu.dylib
