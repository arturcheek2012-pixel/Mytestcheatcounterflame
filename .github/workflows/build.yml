name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate xcodeproj
        run: |
          cd StressKit
          xcodegen generate

      - name: Build archive
        run: |
          cd StressKit
          xcodebuild \
            -scheme StressKit \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/StressKit.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          cd StressKit
          mkdir -p build/Payload
          cp -r build/StressKit.xcarchive/Products/Applications/StressKit.app build/Payload/
          cd build && zip -r StressKit.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: StressKit.ipa
          path: StressKit/build/StressKit.ipa
