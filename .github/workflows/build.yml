name: Build CFEsp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Dobby
        run: |
          git clone --depth=1 https://github.com/jmpews/Dobby.git /tmp/Dobby
          cmake -S /tmp/Dobby -B /tmp/Dobby/build \
            -DCMAKE_TOOLCHAIN_FILE=/tmp/Dobby/cmake/ios.toolchain.cmake \
            -DPLATFORM=OS64 \
            -DDEPLOYMENT_TARGET=14.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DDobby_DEBUG=OFF
          cmake --build /tmp/Dobby/build --config Release

      - name: Compile
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang++ \
            -arch arm64 \
            -isysroot $SDK \
            -fobjc-arc \
            -O2 \
            -dynamiclib \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -lobjc \
            -lc++ \
            -I/tmp/Dobby/include \
            -L/tmp/Dobby/build \
            -ldobby \
            -o CFEsp.dylib \
            Tweak.mm

      - name: Sign
        run: xcrun -sdk iphoneos ldid -S CFEsp.dylib || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CFEsp-dylib
          path: CFEsp.dylib
          retention-days: 14
