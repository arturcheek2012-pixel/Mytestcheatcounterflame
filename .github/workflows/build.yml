name: Build CFEsp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang++ \
            -arch arm64 \
            -isysroot $SDK \
            -fobjc-arc \
            -O2 \
            -dynamiclib \
            -framework UIKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -lobjc \
            -lc++ \
            -o CFEsp.dylib \
            Tweak.mm

      - name: Sign
        run: xcrun -sdk iphoneos ldid -S CFEsp.dylib || true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CFEsp-dylib
          path: CFEsp.dylib
          retention-days: 14
